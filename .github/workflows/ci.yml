name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Commit subjects are 72 characters or fewer
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Check the commits this push or pull request adds; with no earlier
          # commit to compare against (a new branch, or a rewritten one), check
          # the latest.
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range=("$BEFORE..$AFTER")
          else
            range=(-1 "$AFTER")
          fi
          # Dependabot writes its own subjects, which can run long.
          git log --no-merges --format='%an%x09%s' "${range[@]}" | python3 -c '
          import sys
          long = [s for a, s in (l.rstrip("\n").split("\t", 1) for l in sys.stdin)
                  if a != "dependabot[bot]" and len(s) > 72]
          for s in long:
              print(f"{len(s)} characters: {s}")
          sys.exit(1 if long else 0)
          '

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: conversate
          POSTGRES_PASSWORD: conversate
          POSTGRES_DB: conversate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://conversate:conversate@127.0.0.1:5432/conversate_test
      TEST_DATABASE_URL: postgresql://conversate:conversate@127.0.0.1:5432/conversate_test
      # Run the database session outside UTC, so tests catch times read back in
      # local time.
      PGTZ: America/New_York
      # Config requires these; nothing in CI calls Auth0 or Google.
      AUTH0_DOMAIN: ci.invalid
      AUTH0_AUDIENCE: ci
      GOOGLE_CLOUD_API_KEY: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # Must run before pytest, which empties the database when it finishes.
      - name: Migrations apply, match the models, and roll back
        run: |
          flask --app run.py db upgrade
          flask --app run.py db check
          flask --app run.py db downgrade base
          flask --app run.py db upgrade
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
